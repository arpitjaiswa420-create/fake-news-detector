version: '3.8'

services:
  api:
    build: .
    container_name: truthpulse-api
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  ui:
    build: .
    container_name: truthpulse-ui
    ports:
      - "8501:8501"
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
