name: Keep Streamlit App Always Active

on:
  schedule:
    # Runs every 4 hours to guarantee Streamlit Community Cloud never sleeps
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-app:
    name: Heartbeat Ping Streamlit Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App & Keep Container Awake
        env:
          # Reads from Secrets OR Variables tab, with default fallback
          RAW_URL: ${{ secrets.STREAMLIT_APP_URL || vars.STREAMLIT_APP_URL || 'https://arpitjaiswa420-create-fake-news-detector.streamlit.app' }}
        run: |
          # Clean and format URL
          URL="${RAW_URL//\"/}"
          URL="$(echo "$URL" | xargs)"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi
          URL="${URL%/}"
          
          echo "=================================================="
          echo "Target Streamlit URL: $URL"
          echo "=================================================="

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          
          # Function to ping an endpoint with retries
          ping_endpoint() {
            local target="$1"
            local name="$2"
            echo "Sending keep-alive ping to $name ($target)..."
            
            for i in {1..3}; do
              RESPONSE=$(curl -s -L -A "$USER_AGENT" --max-time 30 -o /dev/null -w "%{http_code}" "$target" || echo "000")
              echo "Attempt $i: HTTP Status $RESPONSE"
              if [[ "$RESPONSE" =~ ^(200|301|302|304|307|308)$ ]]; then
                echo "✅ Success: $name responded with HTTP $RESPONSE"
                return 0
              fi
              echo "Retrying in 5 seconds..."
              sleep 5
            done
            echo "⚠️ Ping completed with code $RESPONSE (Streamlit Cloud received network traffic)"
            return 0
          }

          # 1. Main web page ping
          ping_endpoint "$URL" "Main App Page"
          
          # 2. Streamlit internal core health ping (forces container thread activation)
          ping_endpoint "$URL/_stcore/health" "Streamlit Core Health Check"

          echo "=================================================="
          echo "✅ Keep-alive sequence complete! Container is active."
          echo "=================================================="
